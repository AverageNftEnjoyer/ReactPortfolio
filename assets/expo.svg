<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="wc-bg" cx="0.42" cy="0.4" r="0.85">
      <stop offset="0%" stop-color="#111114"/>
      <stop offset="55%" stop-color="#08080a"/>
      <stop offset="100%" stop-color="#020203"/>
    </radialGradient>
    <linearGradient id="wc-panel" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#151518"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="wc-topbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c20"/>
      <stop offset="100%" stop-color="#161619"/>
    </linearGradient>
    <filter id="wc-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="wc-vig" cx="0.46" cy="0.46" r="0.8">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="wc-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
    <clipPath id="wc-frame"><rect width="1920" height="1080"/></clipPath>
  </defs>

  <g clip-path="url(#wc-frame)">
    <rect width="1920" height="1080" fill="url(#wc-bg)"/>

    <!-- faint chevron / bracket watermarks, pure geometry, no type -->
    <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="205,300 95,540 205,780"/>
      <polyline points="1715,300 1825,540 1715,780"/>
    </g>

    <!-- straight-line circuit traces, right-angle bends only -->
    <g stroke="#2c2c32" stroke-width="1.6" fill="none">
      <path d="M1360,340 L1500,340 L1500,220 L1620,220"/>
      <path d="M1360,600 L1560,600 L1560,760 L1700,760"/>
      <path d="M560,420 L400,420 L400,260"/>
      <path d="M560,700 L380,700 L380,860 L260,860"/>
    </g>
    <g fill="#4a4a52">
      <rect x="1616" y="216" width="8" height="8"/>
      <rect x="1696" y="756" width="8" height="8"/>
      <rect x="396" y="256" width="8" height="8"/>
      <rect x="256" y="856" width="8" height="8"/>
    </g>

    <!-- ground shadow -->
    <ellipse cx="960" cy="900" rx="440" ry="48" fill="#000000" opacity="0.5" filter="url(#wc-soft)"/>

    <!-- editor window -->
    <rect x="560" y="210" width="800" height="660" rx="28" fill="url(#wc-panel)" stroke="#2e2e34" stroke-width="1.4"/>
    <path d="M560,238 a28,28 0 0 1 28,-28 h744 a28,28 0 0 1 28,28 v46 h-800 z" fill="url(#wc-topbar)"/>
    <line x1="560" y1="284" x2="1360" y2="284" stroke="#26262b" stroke-width="1.2"/>
    <circle cx="600" cy="256" r="8" fill="#3a3a40"/>
    <circle cx="630" cy="256" r="8" fill="#3a3a40"/>
    <circle cx="660" cy="256" r="8" fill="#3a3a40"/>

    <!-- nested code lines, dim (early) to bright (current) -->
    <g>
      <rect x="620" y="322" width="260" height="14" rx="7" fill="#3a3a42"/>
      <rect x="660" y="368" width="320" height="14" rx="7" fill="#4c4c54"/>
      <rect x="700" y="414" width="180" height="14" rx="7" fill="#5e5e66"/>
      <rect x="700" y="460" width="240" height="14" rx="7" fill="#707177"/>
      <rect x="660" y="506" width="300" height="14" rx="7" fill="#828389"/>
      <rect x="700" y="552" width="200" height="14" rx="7" fill="#94959b"/>
      <rect x="740" y="598" width="140" height="14" rx="7" fill="#a6a7ad"/>
      <rect x="700" y="644" width="260" height="14" rx="7" fill="#b8b9bf"/>
      <rect x="660" y="690" width="220" height="14" rx="7" fill="#caccd0"/>
      <rect x="620" y="736" width="300" height="14" rx="7" fill="#dcdee2"/>
      <rect x="660" y="782" width="200" height="14" rx="7" fill="#eef0f4"/>
    </g>

    <!-- blinking cursor: the one deliberate animation -->
    <rect x="874" y="779" width="10" height="20" rx="2" fill="#f4f5f8">
      <animate attributeName="opacity" values="0.15;0.95;0.15" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <rect width="1920" height="1080" fill="url(#wc-vig)"/>
    <rect width="1920" height="1080" filter="url(#wc-grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
  </g>
</svg>
