<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="qd-bg" cx="0.4" cy="0.32" r="0.95">
      <stop offset="0%" stop-color="#3a4d8c"/>
      <stop offset="55%" stop-color="#22305e"/>
      <stop offset="100%" stop-color="#131c3a"/>
    </radialGradient>
    <radialGradient id="qd-wash" cx="0.4" cy="0.38" r="0.6">
      <stop offset="0%" stop-color="#7fa3ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7fa3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="qd-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="qd-frame"><rect width="1600" height="900"/></clipPath>
  </defs>

  <g clip-path="url(#qd-frame)">
    <rect width="1600" height="900" fill="url(#qd-bg)"/>
    <ellipse cx="640" cy="290" rx="620" ry="440" fill="url(#qd-wash)"/>

    <!-- floor shadow for the elevated diff panel -->
    <ellipse cx="800" cy="740" rx="360" ry="42" fill="#000000" opacity="0.35" filter="url(#qd-shadow)"/>

    <!-- diff comparison panel -->
    <g>
      <rect x="420" y="230" width="760" height="460" rx="24" fill="#ffffff"/>
      <rect x="420" y="230" width="760" height="460" rx="24" fill="none" stroke="#e2e6ef" stroke-width="2"/>

      <!-- window chrome header -->
      <path d="M420,254 a24,24 0 0 1 24,-24 h688 a24,24 0 0 1 24,24 v42 h-736 z" fill="#f5f6f9"/>
      <line x1="420" y1="296" x2="1180" y2="296" stroke="#e7e9f0" stroke-width="1.5"/>
      <circle cx="460" cy="270" r="7" fill="#d7dae2"/>
      <circle cx="488" cy="270" r="7" fill="#d7dae2"/>
      <circle cx="516" cy="270" r="7" fill="#d7dae2"/>

      <!-- live status indicator, the single animated element -->
      <circle cx="1130" cy="270" r="7" fill="#22c55e"/>
      <circle cx="1130" cy="270" r="7" fill="none" stroke="#22c55e" stroke-width="2">
        <animate attributeName="r" values="7;15;7" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
      </circle>

      <!-- center divider + direction chevron -->
      <line x1="800" y1="312" x2="800" y2="660" stroke="#e7e9f0" stroke-width="2"/>
      <polygon points="788,468 812,480 788,492" fill="#2F3AA3"/>

      <!-- before / after rows -->
      <rect x="460" y="336" width="170" height="14" rx="7" fill="#7c8aa5"/>
      <rect x="436" y="379" width="278" height="32" rx="8" fill="rgba(239,68,68,0.12)"/>
      <rect x="446" y="387" width="10" height="16" rx="3" fill="#ef4444"/>
      <rect x="460" y="388" width="230" height="14" rx="7" fill="#7c8aa5"/>
      <rect x="460" y="440" width="140" height="14" rx="7" fill="#7c8aa5"/>
      <rect x="436" y="483" width="248" height="32" rx="8" fill="rgba(239,68,68,0.12)"/>
      <rect x="446" y="491" width="10" height="16" rx="3" fill="#ef4444"/>
      <rect x="460" y="492" width="200" height="14" rx="7" fill="#7c8aa5"/>
      <rect x="460" y="544" width="160" height="14" rx="7" fill="#7c8aa5"/>
      <rect x="850" y="336" width="170" height="14" rx="7" fill="#7c8aa5"/>
      <rect x="826" y="379" width="248" height="32" rx="8" fill="rgba(34,197,94,0.12)"/>
      <rect x="836" y="387" width="10" height="16" rx="3" fill="#22c55e"/>
      <rect x="850" y="388" width="200" height="14" rx="7" fill="#7c8aa5"/>
      <rect x="850" y="440" width="140" height="14" rx="7" fill="#7c8aa5"/>
      <rect x="826" y="483" width="228" height="32" rx="8" fill="rgba(234,179,8,0.14)"/>
      <rect x="836" y="491" width="10" height="16" rx="3" fill="#eab308"/>
      <rect x="850" y="492" width="180" height="14" rx="7" fill="#7c8aa5"/>
      <rect x="826" y="535" width="258" height="32" rx="8" fill="rgba(34,197,94,0.12)"/>
      <rect x="836" y="543" width="10" height="16" rx="3" fill="#22c55e"/>
      <rect x="850" y="544" width="210" height="14" rx="7" fill="#7c8aa5"/>
    </g>
  </g>
</svg>
